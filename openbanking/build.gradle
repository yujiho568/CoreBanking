dependencies {
    implementation 'io.micrometer:micrometer-core'
    implementation 'org.apache.commons:commons-csv:1.10.0'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testRuntimeOnly 'com.h2database:h2'
    implementation project(':common')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}

// Optional, reproducible local experiments; never send load to the public testbed.
tasks.named('test') { useJUnitPlatform { excludeTags 'performance' } }
tasks.register('externalQueryBenchmark', Test) {
    description = 'Measures local delayed HTTP and synthetic H2 queries, not KFTC performance.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'performance' }
    outputs.upToDateWhen { false }
}
