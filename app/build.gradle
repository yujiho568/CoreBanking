plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':common')
    implementation project(':account')
    implementation project(':transfer')
    implementation project(':ledger')
    implementation project(':notification')
    implementation project(':openbanking')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    runtimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly 'com.h2database:h2'
}

// Opt-in disposable DB for local regression; MySQL locking tests keep their separate opt-in gate.
if (project.hasProperty('localTest')) {
    tasks.named('test') {
        systemProperty 'spring.datasource.url', 'jdbc:h2:mem:corebanking;MODE=MySQL;DB_CLOSE_DELAY=-1'
        systemProperty 'spring.datasource.driver-class-name', 'org.h2.Driver'
        systemProperty 'spring.datasource.username', 'sa'
        systemProperty 'spring.datasource.password', ''
        systemProperty 'spring.jpa.hibernate.ddl-auto', 'create-drop'
        systemProperty 'spring.jpa.defer-datasource-initialization', 'true'
        systemProperty 'spring.cache.type', 'none'
        systemProperty 'core-banking.cache.worker-enabled', 'false'
    }
}

configurations { mockRuntime }
dependencies { mockRuntime 'com.h2database:h2' }
tasks.register('mockBootRun', org.springframework.boot.gradle.tasks.run.BootRun) {
    group = 'application'
    description = 'Runs the synthetic local demo on 127.0.0.1:8082; start scripts/mock_openbanking.py first.'
    mainClass = 'com.corebanking.CoreBankingApplication'
    classpath = sourceSets.main.runtimeClasspath + configurations.mockRuntime
    args '--spring.profiles.active=mock', '--server.address=127.0.0.1', '--server.port=8082',
            '--spring.datasource.url=jdbc:h2:mem:mockdemo;MODE=MySQL;DB_CLOSE_DELAY=-1',
            '--spring.datasource.driver-class-name=org.h2.Driver', '--spring.datasource.username=sa',
            '--spring.datasource.password=', '--spring.cache.type=simple',
            '--spring.jpa.hibernate.ddl-auto=update', '--management.health.redis.enabled=false'
}
